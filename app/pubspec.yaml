name: hyper_reader
description: "EPUB reader for language learning."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  intl: ^0.20.3
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Literata
      fonts:
        - asset: assets/fonts/literata/Literata-Regular.ttf
        - asset: assets/fonts/literata/Literata-Italic.ttf
          style: italic
        - asset: assets/fonts/literata/Literata-Bold.ttf
          weight: 700
        - asset: assets/fonts/literata/Literata-BoldItalic.ttf
          weight: 700
          style: italic
