[project]
name = "hyper-reader-api"
version = "0.1.0"
description = "Backend for Hyper Reader: contextual translation and text analysis via AI agents."
readme = "README.md"
authors = [
    { name = "nathalia", email = "nathaliaazmelo@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "openai-agents>=0.24.0",
    "pydantic-settings>=2.16.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
hyper-reader-api = "hyper_reader_api:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
